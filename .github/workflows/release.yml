name: Release APK

# Publish the release APK as a GitHub Release, no manual download needed.
# Add this file on github.com, then run it from the Actions tab.
# It builds the APK and attaches it as Archive-TV-v1.14.apk to release v1.14.
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 34 and build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decrypt release keystore
        run: |
          base64 -d release.keystore.enc.b64 > release.keystore.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -in release.keystore.enc -out release.keystore -pass pass:"${{ secrets.KEYSTORE_PASSWORD }}"
          ls -l release.keystore
          echo "KEYSTORE_PATH=$PWD/release.keystore" >> $GITHUB_ENV

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK to Archive-TV-v1.14.apk
        run: cp app/build/outputs/apk/release/app-release.apk Archive-TV-v1.14.apk

      - name: Create release v1.14 with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.14
          name: Archive TV v1.14
          body: Archive TV v1.14, package com.archivetv.app, update banner is a popup, Check for updates in the Menu, and the genre picker is synced on every play.
          files: Archive-TV-v1.14.apk
