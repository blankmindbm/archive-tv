name: Release APK

# Publish the debug APK as a GitHub Release, no manual download needed.
# Add this file on github.com, then run it from the Actions tab.
# It builds the APK and attaches app-debug.apk to release v1.6.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform 34 and build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK to Archive-TV-v1.6.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Archive-TV-v1.6.apk
      - name: Create release v1.6 with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6
          name: Archive TV v1.6
          body: Archive TV v1.6, package com.archivetv.app, with English-only videos on every channel.
          files: Archive-TV-v1.6.apk
